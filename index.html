<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baking!</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Title -->
    <h1>What do I want to bake today?</h1>
    <img id="baking" src="css/images/baking.jpg">

    <!-- header -->
    <h2 class="heading">Let's see what you should bake!</h2>

    <!-- Ask what flavour user wants to bake -->
    <div class="button">
        <h2 class="heading">Do you want to make something:</h2>
        <button onclick="selectedflavour('Chocolate')">Chocolate</button>
        <button onclick="selectedflavour('Vanilla')">Vanilla</button>
        <button onclick="selectedflavour('Fruity')">Fruity</button>
        <button onclick="selectedflavour('Caramel')">Caramel</button>
    </div>

    <!-- Ask what type of item user is in the mood for -->
    <div class="button">
        <h2 class="heading">What are you in the mood for?</h2>
        <button onclick="selectedtype('Cake')">Cake</button>
        <button onclick="selectedtype('Cookies')">Cookies</button>
        <button onclick="selectedtype('Mousse')">Mousse</button>
        <button onclick="selectedtype('Pastry')">Pastry</button>
    </div>

    <!-- Give user their result after they click button -->
    <h2 class = "heading">Here is your final decision!</h2>
    <h2 class="heading">Click the button below to see what you should bake!</h2>
    <div class="button">
        <button onclick="bakingFunction()">Click to see what to make?</button>
    </div>
    <!-- Display result image -->
    <img id="decision" src="css/images/decision.avif"

    <!-- Javascript connection -->
    <script src="js/script.js"></script>

</body>
</html>
